#
# Created by Jared Barneck (Rhyous).
# Weekly: upgrade every out-of-date NuGet package, build, run the tests on every target framework,
# and open a pull request with the result.
#
# Repository setting required (once):
#   Settings > Actions > General > Workflow permissions >
#   check "Allow GitHub Actions to create and approve pull requests".
#
# Note: pull requests created with the default GITHUB_TOKEN do not trigger other workflows (a GitHub
# restriction), so the "CI - Main" checks will not run on the auto-update PR. Either close and re-open the
# PR to start them, or add a PAT secret named GH_PAT (repo scope) and the workflow will use it instead.
#
name: NuGet Auto-update

on:
  schedule:
    # 0 2 * * 1 == Mondays at 02:00 UTC
    - cron: '0 2 * * 1'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        # There should only be one solution file (.sln) and it should be in the src dir.
        working-directory: src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The projects multi-target net8.0, net9.0 and net10.0, so all three runtimes are needed to run the
      # tests. The newest SDK is also the one that runs dotnet-outdated.
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install dotnet-outdated tool
        run: dotnet tool install --global dotnet-outdated-tool --version 4.9.0

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      #
      # Upgrade every PackageReference to its latest version, majors included. We move forward, we do not pin.
      #
      # dotnet-outdated evaluates each target framework, so a package whose newest major has no assets for
      # an older TFM (for example Microsoft.Extensions.* 11.x has no net8.0 / net9.0 assets) shows up as a
      # failed build or test below instead of a silent break. When that happens, give the project per-TFM
      # <ItemGroup Condition="'$(TargetFramework)' == 'net8.0'"> package references, each on the newest
      # version that ships assets for that target. ASP.NET Core and Microsoft.Extensions.* come from the
      # Microsoft.AspNetCore.App shared framework (FrameworkReference), so they need no PackageReference.
      #
      - name: Run outdated check & upgrade
        run: dotnet outdated --upgrade --recursive

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "TestCategory!=SkipCI"

      # Commit & push changes (nothing happens if no package changed)
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "Update NuGet dependencies"
          branch: auto-update/nuget-dependencies
          title: "Auto-update NuGet dependencies"
          body: |
            This PR was generated by the NuGet Auto-update workflow.
            - Upgrades all out-of-date PackageReferences to their latest versions.
            - The solution built in Release and all unit tests passed on net8.0, net9.0 and net10.0.
          draft: false
          signoff: false
