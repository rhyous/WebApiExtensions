# Created by Jared Barneck (Rhyous).
# Used to build dotnet microlibraries and publish them to NuGet
name: CI - Main
 
# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the "main" branches
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**/*.yml'
      - '!.github/workflows/main.yml'
      - '**/*.Tests/**'
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/docs/**'
      - '**/NuGet.Config'
      - '.gitignore'

  # Builds and tests pull requests too. Publishing to NuGet only happens on a push to main.
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
env:
  VERSION_PREFIX: '2.0' # The version prefix. Use SemVer to know when to change this.
  COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
  dotnet-version: |
    8.0.x
    9.0.x
    10.0.x
  
# The repository default for GITHUB_TOKEN is read-only; the coverage step comments on pull requests.
permissions:
  contents: read
  pull-requests: write

# Ensure only one run per branch/PR at a time, cancelling the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # A Job Step to get the version
  #
  find_version:
    name: Find Version
    runs-on: ubuntu-latest
    outputs:
      ASSEMBLY_VERSION: ${{ steps.set_version.outputs.VERSION }}.0.0 # The version of the assembly to use: 1.0.0.0
      DOTNET_VERSION: ${{ env.DOTNET_VERSION }} # The version of dotnet to use.
      NUGET_VERSION: ${{ steps.set_version.outputs.VERSION }}.${{ github.run_number }}${{ github.ref != 'refs/heads/main' && '-prerelease-' || '' }}${{ github.ref != 'refs/heads/main' && steps.set_version.outputs.SHORT_COMMIT_HASH || '' }}
      VERSION: ${{ steps.set_version.outputs.VERSION }}.${{ github.run_number }} # The version with the run number in the 3rd position.
    steps:
    - name: Git clone the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set Version
      id:  set_version
      run: |
        echo "VERSION=$VERSION_PREFIX" >> $GITHUB_OUTPUT
        echo "SHORT_COMMIT_HASH=$(git rev-parse --short $COMMIT_HASH)" >> $GITHUB_OUTPUT

  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: [find_version]
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
    defaults:
      run:
        # There should only be one solution file (.sln) and it should be in the src dir.
        working-directory: src
 
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
       
      # Get dotnet setup and ready to work
      - name: Setup .NET Core SDK ${{ env.dotnet-version }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.dotnet-version }}
 
      # Restore nuget packages
      - name: Restoring NuGet packages
        run: dotnet restore
         
      # Build - Main
      - name: Build source
        run: dotnet build --configuration Release --no-restore -p:AssemblyVersion=${{ needs.find_version.outputs.ASSEMBLY_VERSION }} -p:FileVersion=${{ needs.find_version.outputs.VERSION }} -p:Version=${{ needs.find_version.outputs.VERSION }} -p:PackageVersion=${{ needs.find_version.outputs.NUGET_VERSION }} -p:RepositoryBranch=${{ github.ref_name }} -p:RepositoryCommit=${{ env.COMMIT_HASH }}
          
      # Run Unit Tests
      # Add coverlet.collector nuget package to test project - 'dotnet add <TestProject.cspoj> package coverlet'
      - name: Run Tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory coverage --filter TestCategory!=SkipCI
         
      # Install ReportGenerator
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
         
      # Run ReportGenerator
      - name: Run ReportGenerator
        run: reportgenerator -reports:./coverage/*/coverage.cobertura.xml -targetdir:coveragereport -reportType:Cobertura
         
      # Code Coverage
      - name: Code Coverage Report
        if: runner.os == 'Linux'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: '**/Cobertura.xml'
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
 
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: runner.os == 'Linux'&& github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
 
      # Publish NuGet using Trusted Publishing (OIDC)
      - name: NuGet login via Trusted Publishing
        id: login
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish the NuGet package
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: dotnet nuget push "**/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
   
